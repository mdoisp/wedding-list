name: CD

on:
  push:
    branches: ["main"]

# Deploys frontend to Vercel and verifies health of production services
# Note: Backend is deployed automatically by Railway via native GitHub integration

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: https://backend-wedding-list.up.railway.app
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  verify-production:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Check Backend Health (Railway)
        run: curl --fail --retry 5 --retry-delay 5 --retry-connrefused https://backend-wedding-list.up.railway.app/health

      - name: Check Frontend Health (Vercel)
        run: curl --fail --retry 5 --retry-delay 5 --retry-connrefused https://wedding-list-pearl.vercel.app
